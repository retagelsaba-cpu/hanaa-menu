<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم هناء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a07;--panel:#0d0907;--ink:#f6ebdd;--mute:#b3a090;--red:#b01220;--red2:#6d0a12;--gold:#e0b04a;--line:#3a2b22;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:120px}
body{font-family:Cairo,Tahoma,sans-serif;color:var(--ink);padding-bottom:110px;background:radial-gradient(circle at 15% 8%,#5a2a12 0,transparent 35%),radial-gradient(circle at 90% 30%,#4a1d10 0,transparent 35%),radial-gradient(circle at 10% 75%,#47220f 0,transparent 30%),var(--bg);background-attachment:fixed}
header{text-align:center;padding:14px 12px 4px}
header img{width:120px;height:auto;border-radius:50%;display:block;margin:0 auto -6px}
.rib{position:relative;margin:6px auto 0;max-width:520px;padding:10px 40px 8px;background:linear-gradient(#c01524,#7a0b14);color:#fff;clip-path:polygon(0 18%,6% 18%,6% 0,94% 0,94% 18%,100% 18%,97% 55%,100% 90%,94% 90%,94% 100%,6% 100%,6% 90%,0 90%,3% 55%);border-bottom:3px solid var(--gold)}
.rib h1{font-size:2.1rem;font-weight:800;text-shadow:0 3px 6px #0008}
.rib p{font-size:.95rem;font-weight:600;color:#ffe3a0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#120a07ee;padding:10px 12px 6px;backdrop-filter:blur(6px)}
.bar input{width:100%;padding:11px 16px;border-radius:999px;border:1.5px solid var(--gold);background:var(--panel);color:var(--ink);font:inherit}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs button{flex:none;padding:6px 16px;border-radius:999px;border:1.5px solid var(--gold);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:linear-gradient(#c01524,#7a0b14);color:#fff}
main{padding:6px 12px;max-width:760px;margin:auto}
.panel{background:#0d0907e0;border:1.5px solid var(--gold);border-radius:18px;padding:0 12px 8px;margin:34px 0 8px}
.pill{display:block;width:fit-content;margin:-20px auto 4px;padding:3px 34px;border-radius:999px;border:2px solid var(--gold);background:linear-gradient(#c01524,#7a0b14);color:#fff;font-size:1.35rem;font-weight:800}
.sub{display:block;text-align:center;color:var(--gold);font-size:.85rem;margin-bottom:4px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.th{flex:none;width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:1.9rem;background:radial-gradient(circle at 35% 30%,#7a3a1a,#2a120a)}
.item .n{flex:1;font-weight:700;font-size:1.02rem}
.item .n i{display:block;font-style:normal;font-weight:400;font-size:.75rem;color:var(--mute)}
.price{font-weight:800;color:var(--gold);white-space:nowrap;font-size:.95rem}
.add{background:linear-gradient(#c01524,#7a0b14);color:#fff;border:1.5px solid var(--gold);border-radius:10px;padding:6px 11px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.col{display:flex;flex-direction:column;align-items:center;gap:5px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);background:var(--red);color:#fff;font-size:1.2rem;cursor:pointer;line-height:1}
.qty b{min-width:20px;text-align:center}
.empty{text-align:center;color:var(--mute);padding:40px}
.foot{margin:22px auto;width:fit-content;padding:8px 36px;border-radius:999px;border:2px solid var(--gold);background:linear-gradient(#c01524,#7a0b14);font-weight:800;font-size:1.1rem}
#fl{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;max-width:736px;margin:auto;background:linear-gradient(#c01524,#7a0b14);color:#fff;border:2px solid var(--gold);border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;align-items:center;font:inherit;font-weight:800;cursor:pointer;z-index:6;box-shadow:0 6px 20px #000a}
#ov{position:fixed;inset:0;background:#000b;display:none;z-index:9;align-items:flex-end;justify-content:center}
#sh{background:#17100d;border:2px solid var(--gold);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sh h3{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--gold)}
#sh h3 button{background:none;border:0;font-size:1.6rem;color:var(--ink);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);gap:8px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding:12px 0;color:var(--gold)}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--gold);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:linear-gradient(#c01524,#7a0b14)}
#sh input,#sh textarea{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.send{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#1fa855;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.note{font-size:.8rem;color:var(--mute);margin-top:6px}
#pk{position:fixed;inset:0;background:#000b;display:none;z-index:10;align-items:flex-end;justify-content:center}
#pkb{background:#17100d;border:2px solid var(--gold);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#pkb h3{display:flex;justify-content:space-between;color:var(--gold)}
#pkb h3 button{background:none;border:0;font-size:1.6rem;color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{flex:1;min-width:64px;padding:9px 6px;border-radius:10px;border:1.5px solid var(--gold);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.chips button.on{background:linear-gradient(#c01524,#7a0b14)}
.qty.big{justify-content:center;gap:22px;margin:8px 0}
.qty.big button{width:46px;height:46px;font-size:1.6rem}
.qty.big b{font-size:1.4rem;min-width:90px}
.qv{background:none;border:1px dashed var(--gold);color:var(--ink);font:inherit;font-weight:800;padding:2px 9px;border-radius:8px;cursor:pointer;min-width:52px}
.del{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1.5px solid var(--red);background:none;color:#ff8a8f;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>

  <div class="seg"><button data-m="in" class="${mode==="in"?"on":""}">🍽️ داخل المطعم</button><button data-m="out" class="${mode==="out"?"on":""}">🛵 توصيل للمنزل</button></div>`;
  h+=mode==="in"?`<input id="tb" placeholder="رقم الطاولة" value="${form.tb}">`:`<input id="nm" placeholder="الاسم" value="${form.nm}"><input id="ad" placeholder="العنوان بالتفصيل" value="${form.ad}">`;
  h+=`<textarea id="nt" rows="2" placeholder="ملاحظات على الأكل (اختياري)">${form.nt}</textarea><button class="send" data-send>إرسال الطلب عبر واتساب</button>`;
 }
 $("#sh").innerHTML=h;$("#ov").style.display="flex";
}
function send(){
 ["tb","nm","ad","nt"].forEach(k=>{const e=$("#"+k);if(e)form[k]=e.value.trim()});
 if(mode==="in"&&!form.tb)return alert("من فضلك اكتب رقم الطاولة");
 if(mode==="out"&&(!form.nm||!form.ad))return alert("من فضلك اكتب الاسم والعنوان");
 const{t,np}=tot();
 let m="🌙 *طلب جديد - مطعم هناء*\n━━━━━━━━━━━━━━\n";
 m+=mode==="in"?`🍽️ *داخل المطعم*\n🪑 الطاولة: ${form.tb}\n`:`🛵 *توصيل للمنزل*\n👤 الاسم: ${form.nm}\n📍 العنوان: ${form.ad}\n`;
 m+="━━━━━━━━━━━━━━\n📋 *الطلب:*\n";
 Object.keys(cart).forEach((k,j)=>{const it=ALL[k-1],q=cart[k];m+=`${j+1}. ${it.n} × ${q}${it.w?" كجم":""}`+(it.p?` = ${lt(it,q)} ج`:" (السعر عند الكاشير)")+"\n"});
 m+="━━━━━━━━━━━━━━\n";
 if(form.nt)m+=`📝 ملاحظات: ${form.nt}\n━━━━━━━━━━━━━━\n`;
 m+=`💰 *الإجمالي: ${t} ج*${np?" (+ أصناف تُحسب عند الكاشير)":""}\n🕒 ${new Date().toLocaleString("ar-EG")}`;
 window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(m),"_blank");
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.a)chg(+b.dataset.i,(b.dataset.a==="+"?1:-1)*stp(ALL[b.dataset.i-1]));
 else if(b.dataset.p)pick(+b.dataset.p);
 else if(b.dataset.pq){pk.q=+b.dataset.pq;pkr()}
 else if(b.dataset.ps){const it=ALL[pk.i-1];pk.q=Math.max(stp(it),pk.q+b.dataset.ps*stp(it));pkr()}
 else if(b.dataset.pc!==undefined){cart[pk.i]=pk.q;save();pkx();render();if($("#ov").style.display==="flex")sheet()}
 else if(b.dataset.pd!==undefined){delete cart[pk.i];save();pkx();render();if($("#ov").style.display==="flex")sheet()}
 else if(b.dataset.px!==undefined)pkx();
 else if(b.dataset.c!==undefined){cat=b.dataset.c;render();scrollTo({top:0,behavior:"smooth"})}
 else if(b.dataset.m){["tb","nm","ad","nt"].forEach(k=>{const x=$("#"+k);if(x)form[k]=x.value});mode=b.dataset.m;sheet()}
 else if(b.dataset.send!==undefined)send();
 else if(b.dataset.x!==undefined)$("#ov").style.display="none";
 else if(b.id==="fl")sheet();
});

function csv(t){const r=[];let a=[],f="",q=0;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==","){a.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;a.push(f);f="";r.push(a);a=[]}else f+=c}if(f||a.length){a.push(f);r.push(a)}return r}
function fromCsv(t){const R=csv(t).slice(1),m={},o=[];
 R.forEach(r=>{if(r.length<3||!(r[0]||"").trim()||!(r[1]||"").trim())return;if((r[4]||"").trim()==="لا")return;
 const w=(r[3]||"").trim()==="كجم",p=parseFloat((r[2]||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)))||0,k=r[0].trim();
 if(!m[k]){m[k]={t:k,s:(RAW.find(c=>c.t===k)||{}).s,i:[]};o.push(m[k])}
 m[k].i.push([r[1].trim(),w?p/4:p,(r[5]||"").trim()||"🍽️",(r[6]||"").trim(),w])});
 return o.filter(c=>c.i.length)}
function apply(t){try{const o=fromCsv(t);if(!o.length)return false;build(o);const g=ALL.map(x=>x.n).join("|");let old="";try{old=localStorage.getItem("hsig")||"";localStorage.setItem("hsig",g)}catch(e){}if(old!==g){cart={};save()}return true}catch(e){return false}}
(async()=>{if(!SHEET_URL)return;
 try{if(!localStorage.getItem("hsig"))localStorage.setItem("hsig",ALL.map(x=>x.n).join("|"))}catch(e){}
 let c="";try{c=localStorage.getItem("hcsv")||""}catch(e){}
 if(c&&apply(c))render();
 try{const r=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)return;const t=await r.text();if(apply(t)){try{localStorage.setItem("hcsv",t)}catch(e){}render()}}catch(e){}})();
render();
</script>
